# dcg-scan.yml — Scan PR diffs for destructive commands
#
# This workflow runs `dcg scan --git-diff` on pull requests to detect
# dangerous patterns in changed files before they're merged.
#
# USAGE: Copy this file to your project's .github/workflows/ directory.
#
# CONFIGURATION:
#   - Set DCG_FAIL_ON to control exit behavior:
#     - "error" (default): Fail only on error-severity findings
#     - "warning": Fail on warnings and errors
#     - "none": Never fail (informational only)
#
#   - Set DCG_VERSION to pin a specific version:
#     - "latest" (default): Use latest release
#     - "v0.2.0": Use specific version tag

name: dcg-scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  CARGO_TERM_COLOR: always
  # Fail policy: "error" | "warning" | "none"
  DCG_FAIL_ON: error
  # Version to use: "latest" or specific tag like "v0.2.0"
  DCG_VERSION: latest

jobs:
  scan:
    name: Scan for destructive commands
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Fetch enough history for git diff
          fetch-depth: 0

      # Asset selection rule (transformate WI-3320): from the release JSON, pick the
      # asset whose name matches the runner OS (`uname -s`, linux only) and CPU
      # (`uname -m`, x86_64/amd64 accepted), skipping checksum/signature files;
      # prefer an archive (.tar.gz/.tgz/.tar.xz/.zip) containing a `dcg` executable,
      # else a bare binary. The result must pass `file` as an ELF 64-bit x86-64
      # executable; on any mismatch (wrong arch, HTML error page, empty file) or
      # missing asset we fall back to `cargo install destructive_command_guard`.
      - name: Download dcg binary
        run: |
          set -uo pipefail
          if [ "$DCG_VERSION" = "latest" ]; then
            RELEASE_URL="https://api.github.com/repos/Dicklesworthstone/destructive_command_guard/releases/latest"
          else
            RELEASE_URL="https://api.github.com/repos/Dicklesworthstone/destructive_command_guard/releases/tags/$DCG_VERSION"
          fi

          install_from_source() {
            echo "::warning::$1 — building dcg from source with cargo install"
            if ! command -v cargo >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              source "$HOME/.cargo/env"
            fi
            cargo install destructive_command_guard --locked
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          }

          OS=$(uname -s | tr 'A-Z' 'a-z')
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64) ARCH_RE='(x86_64|amd64)' ;;
            *) ARCH_RE="$ARCH" ;;
          esac
          if [ "$OS" != "linux" ]; then
            install_from_source "unsupported runner OS '$OS'"
            exit 0
          fi

          # RELEASE_JSON_FILE lets the selection logic be tested against a fixture;
          # it defaults to the live GitHub API query.
          if [ -n "${RELEASE_JSON_FILE:-}" ]; then
            RELEASE_JSON=$(cat "$RELEASE_JSON_FILE")
          else
            RELEASE_JSON=$(curl -sL "$RELEASE_URL")
          fi

          SELECTED=$(printf '%s' "$RELEASE_JSON" | jq -r --arg os "$OS" --arg arch "$ARCH_RE" '
            [ .assets[]?
              | select(.name | test("\\.(sha256|sha512|minisig|sig|asc|txt|md)$"; "i") | not)
              | select(.name | ascii_downcase | contains($os))
              | select(.name | test($arch; "i"))
              | . + { rank: (if (.name | test("\\.(tar\\.gz|tgz|tar\\.xz|zip)$"; "i")) then 0 else 1 end) }
            ]
            | sort_by(.rank, .name) | .[0]
            | select(. != null)
            | "\(.name)\t\(.browser_download_url)"' 2>/dev/null || true)

          if [ -z "$SELECTED" ]; then
            install_from_source "no release asset matches $OS/$ARCH"
            exit 0
          fi
          ASSET_NAME=${SELECTED%%$'\t'*}
          DOWNLOAD_URL=${SELECTED#*$'\t'}
          echo "Selected release asset: $ASSET_NAME"
          echo "Downloading dcg from: $DOWNLOAD_URL"

          WORK=$(mktemp -d)
          if ! curl -sSL --fail "$DOWNLOAD_URL" -o "$WORK/$ASSET_NAME"; then
            install_from_source "download of $ASSET_NAME failed"
            exit 0
          fi

          BIN=""
          case "$ASSET_NAME" in
            *.tar.gz|*.tgz) tar -xzf "$WORK/$ASSET_NAME" -C "$WORK" 2>/dev/null || true ;;
            *.tar.xz)       tar -xJf "$WORK/$ASSET_NAME" -C "$WORK" 2>/dev/null || true ;;
            *.zip)          unzip -qo "$WORK/$ASSET_NAME" -d "$WORK" 2>/dev/null || true ;;
            *)              BIN="$WORK/$ASSET_NAME" ;;
          esac
          if [ -z "$BIN" ]; then
            BIN=$(find "$WORK" -type f -name dcg | head -1)
          fi

          # The binary must be an ELF 64-bit x86-64 executable for this runner.
          FILE_TYPE=$( [ -n "$BIN" ] && [ -s "$BIN" ] && file -b "$BIN" || echo "missing or empty" )
          echo "file check: $FILE_TYPE"
          if ! printf '%s' "$FILE_TYPE" | grep -q 'ELF 64-bit.*x86-64'; then
            install_from_source "asset $ASSET_NAME is not an x86-64 ELF binary ($FILE_TYPE)"
            exit 0
          fi

          sudo install -m 0755 "$BIN" /usr/local/bin/dcg
          # No cleanup of $WORK: the GitHub runner workspace and mktemp -d under RUNNER_TEMP are ephemeral.

      - name: Verify dcg installation
        run: dcg --version

      - name: Determine base commit
        id: base
        run: |
          # Use the merge base between PR branch and target branch
          BASE_SHA=$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "sha=$BASE_SHA" >> $GITHUB_OUTPUT
          echo "Base commit: $BASE_SHA"

      - name: Run dcg scan on changed files
        id: scan
        run: |
          set +e  # Don't exit on error so we can capture the exit code

          # Build the diff range
          DIFF_RANGE="${{ steps.base.outputs.sha }}...${{ github.event.pull_request.head.sha }}"
          echo "Scanning diff range: $DIFF_RANGE"

          # Run the scan (stdout=JSON, stderr=debug messages)
          dcg scan \
            --git-diff "$DIFF_RANGE" \
            --format json \
            --fail-on "$DCG_FAIL_ON" \
            > scan-results.json

          SCAN_EXIT=$?
          echo "exit_code=$SCAN_EXIT" >> $GITHUB_OUTPUT

          # Always output results for debugging
          cat scan-results.json

          # Parse summary for step summary
          if [ -f scan-results.json ] && jq -e '.summary' scan-results.json > /dev/null 2>&1; then
            TOTAL=$(jq '.summary.findings_total // 0' scan-results.json)
            ERRORS=$(jq '.summary.severities.error // 0' scan-results.json)
            WARNINGS=$(jq '.summary.severities.warning // 0' scan-results.json)

            echo "## DCG Scan Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Findings | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
            echo "| Warnings | $WARNINGS |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "$SCAN_EXIT" -ne 0 ]; then
              echo "**Status: FAILED** (exit code $SCAN_EXIT)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Review the findings below and fix any destructive patterns before merging." >> $GITHUB_STEP_SUMMARY
            else
              echo "**Status: PASSED**" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "## DCG Scan Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No findings or scan output could not be parsed." >> $GITHUB_STEP_SUMMARY
          fi

          exit $SCAN_EXIT

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dcg-scan-results
          path: scan-results.json
          retention-days: 14
          if-no-files-found: ignore

  # Optional: Build from source (for repos that want to build dcg themselves)
  # Uncomment this job and remove the "Download dcg binary" step above
  #
  # build-dcg:
  #   name: Build dcg from source
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: dtolnay/rust-toolchain@nightly
  #     - name: Build dcg
  #       run: cargo install destructive_command_guard --locked
  #     - name: Upload binary
  #       uses: actions/upload-artifact@v7
  #       with:
  #         name: dcg-binary
  #         path: ~/.cargo/bin/dcg
