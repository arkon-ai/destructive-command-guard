# transformate.secrets_emit — DCG custom pack
#
# Closes the gap upstream DCG does NOT cover: secret EMISSION via stdout.
# Upstream's secrets/vault/aws_secrets/onepassword/doppler packs guard
# DESTRUCTION of secret stores; they do not block values flowing to stdout.
#
# Source incidents (driving these patterns):
#   - 6+ secret leaks across 12 days (April 2026)
#   - WI-080: bare DSN in env file echoed to stdout via `set -a; source FILE`
#   - WI-081: gratuitous `head -16` on a freshly-patched env file post-leak-safe-verify
#   - Repeated `infisical secrets --plain` and `printenv` accidents
#
# Pack contract:
#   - schema_version 1 (matches upstream DCG /docs/pack.schema.yaml)
#   - severity: critical for emission patterns (always deny; not allowlistable)
#   - safe_patterns scoped tightly so legitimate single-key reads still work
#
# Companion memory:
#   - feedback_silent_quiet_secret_emitting_commands.md
#   - feedback_no_bare_dsns_in_env_files.md
#   - feedback_hard_blockers_not_prompt_guardrails.md
#   - reference_dcg_destructive_command_guard.md

schema_version: 1

id: transformate.secrets_emit

name: Transformate — Secret Emission Guards

version: 1.1.0

description: |
  Blocks Bash patterns that emit secret VALUES (not destroy secret stores) to stdout.
  Built for the Warden / Codesmith / Sentinel / Mentor / Steward fleet operating with
  bash + Infisical + cloud creds. Closes the emission-class gap left by upstream DCG.

# Keywords gate evaluation. Hit any → pack patterns run. Tuned to be inclusive
# of every emission verb we've seen abused.
keywords:
  - infisical
  - docker
  - printenv
  - env
  - set
  - cat
  - grep
  - at
  - /proc

destructive_patterns:

  # --- Infisical CLI ---
  # `infisical secrets` with NO subcommand (or destructive flags) prints all values.
  # Allow: `infisical secrets get NAME`, `infisical secrets list-keys-only`,
  # `infisical secrets set`, `infisical secrets delete`, `infisical run`.
  - name: infisical-secrets-bulk-print
    pattern: \binfisical\s+secrets\b(?!\s+(?:get\s+\S+|list-keys-only|set\b|delete\b|--help|-h\b))
    severity: critical
    description: Bulk infisical secret print blocked (use `secrets get NAME` or `infisical run`)
    explanation: |
      `infisical secrets` and `infisical secrets --plain` print every value to stdout.
      Single-secret reads via `infisical secrets get NAME` are allowed.
      For runtime injection use `infisical run -- <cmd>` so values never hit your terminal.

  # --- Docker config env emission ---
  - name: docker-inspect-config-env
    pattern: \bdocker\s+(?:container\s+)?inspect\b[^|]*--format[^|]*Config\.Env
    severity: critical
    description: docker inspect emitting Config.Env blocked
    explanation: |
      `docker inspect --format '{{.Config.Env}}'` dumps every env var the container
      was launched with — including any secrets passed at run-time. Use
      `docker exec <c> printenv VAR_NAME` for a single value, or read the secret
      from the secret manager directly.

  # --- printenv with no argument ---
  - name: printenv-bulk
    pattern: ^\s*printenv\s*(?:\||\s*$|\s*>)
    severity: critical
    description: Bulk printenv blocked (specify a single VAR name)
    explanation: |
      `printenv` with no argument prints every environment variable. Use
      `printenv VAR_NAME` to read a single value, or pipe the secret manager
      directly into the consumer.

  # --- env with no argument or env|grep ---
  - name: env-bulk-or-grep
    pattern: (?:^|;|\||&&|\|\|)\s*env\s*(?:\||\s*$|\s*>|\s*\|\s*grep)
    severity: critical
    description: Bare `env` or `env | grep` blocked
    explanation: |
      `env`, `env | grep PATTERN`, and `env > file` all enumerate every variable
      in the process environment. Inspect a single var with `printenv VAR_NAME`
      or test for presence with `[ -n "${VAR:-}" ]`.

  # --- set with no argument or set|grep (Bash dumps every shell var + function) ---
  - name: set-bulk-or-grep
    pattern: (?:^|;|\||&&|\|\|)\s*set\s*(?:\||\s*$|\s*>|\s*\|\s*grep)
    severity: critical
    description: Bare `set` or `set | grep` blocked
    explanation: |
      `set` with no argument dumps every shell variable AND function definition,
      including secrets sourced from .env files. Use `declare -p VAR_NAME` for
      a single value (still risky — prefer secret-manager reads).

  # --- cat on secret-bearing file extensions ---
  - name: cat-secret-file-extension
    pattern: \bcat\s+[^\s|;&]*\.(?:url|env|env\.local|env\.[\w-]+|secret|secrets|key|pem|credentials|netrc)\b
    severity: critical
    description: cat on secret-bearing file blocked
    explanation: |
      Files ending in .url / .env / .env.local / .env.<role> / .secret(s) / .key /
      .pem / .credentials / .netrc almost always contain credentials. Read the
      specific value you need via `grep '^KEY=' file | cut -d= -f2-` or load via
      `set -a; source file; set +a` followed by referencing `$KEY` (NEVER echo $KEY).

  # --- cat on standard credential file paths (regardless of extension) ---
  - name: cat-credential-file-path
    pattern: \bcat\s+[^\s|;&]*(?:\.aws/credentials|\.ssh/[^/\s]*_(?:rsa|ed25519|ecdsa)|\.docker/config\.json|\.netrc|\.pgpass|\.kube/config)\b
    severity: critical
    description: cat on standard credential file path blocked
    explanation: |
      Reading these files with `cat` emits private keys / passwords / tokens to
      stdout where they end up in shell history, terminal scrollback, and any
      logging surface watching the session.

  # --- `at -c <jobid>` dumps queue-time env (2026-05-01 GOOGLE_OAUTH_CLIENT_JSON leak) ---
  - name: at-c-job-env-dump
    pattern: \bat\s+-c\s+\S+
    severity: critical
    description: '`at -c <jobid>` blocked — dumps queue-time env to stdout'
    explanation: |
      `at -c <jobid>` prints the FULL queue-time environment (every exported
      variable) as a `set -a; export VAR=value; ...` prelude before the job
      script. Any shell that has Infisical secrets injected at queue-time
      leaks ALL of them through `at -c` — this is how WI-196 / GOOGLE_OAUTH_CLIENT_JSON
      leaked 2026-05-01.
      Use `atq` to verify a job exists (lists job IDs + scheduled time only).
      To inspect what a job will run, use `at -c <id>` from a shell that has
      NEVER had secrets in env — open a fresh shell first, never re-use the
      same shell that queued the job.

  # --- /proc/<pid>/environ exposes a process's launch env via the kernel ---
  - name: proc-environ-read
    pattern: (?:cat|less|more|head|tail|xxd|od|hexdump|strings|tr\s+\S+\s+\S+\s*<)\s+[^|;&]*?/proc/[^/\s]+/environ\b
    severity: critical
    description: 'Reading /proc/<pid>/environ blocked — exposes process env'
    explanation: |
      `/proc/<pid>/environ` is the kernel-exposed snapshot of a process's
      launch environment (NUL-separated VAR=VAL pairs). Reading it via
      cat/less/xxd/strings/tr/od reveals every secret that process started
      with. Single-process secret-bearing processes (bridge, observability,
      etc) MUST NOT have their environ read this way. The 2026-04-30 leak of
      `infisical-injected` env via `head -16 /proc/PID/environ` triggered
      this pattern.
      To check if a process has a specific var set without leaking values,
      use `pgrep -a NAME` (shows command line, not env) or read from the
      secret manager (Infisical) directly.

  # --- grep for credential-shaped strings (recursive) ---
  - name: grep-credential-keywords
    pattern: \bgrep\s+(?:-r\b|--recursive\b|-R\b)[^|]*\b(?:password|passwd|secret|token|api[-_]?key|bearer|client[-_]?secret|access[-_]?key|private[-_]?key)\b
    severity: critical
    description: Recursive grep for credential keywords blocked
    explanation: |
      Recursive grep across a tree for "password" / "secret" / "token" / "api_key"
      almost always emits matched lines (which contain the secret value). Search
      for filenames instead with `find . -name '*secret*' -print` or use code search
      tools that redact matches.

# Safe patterns — explicit allows. Take precedence over destructive_patterns.
# Keep these tightly scoped; over-broad allows defeat the purpose of the pack.
safe_patterns:

  - name: infisical-single-get
    pattern: \binfisical\s+secrets\s+get\s+\S+
    description: Single-secret read via `infisical secrets get NAME`

  - name: infisical-list-keys-only
    pattern: \binfisical\s+secrets\s+list-keys-only\b
    description: List secret KEY NAMES (no values)

  - name: infisical-run-injection
    pattern: \binfisical\s+run\s+--
    description: Runtime injection via `infisical run -- <cmd>` (values never echoed)

  - name: printenv-single-var
    pattern: ^\s*printenv\s+[A-Z_][A-Z0-9_]*\s*$
    description: Single named variable via `printenv VAR_NAME`

  - name: cat-readme-or-changelog
    pattern: \bcat\s+[^\s]*(?:README|CHANGELOG|LICENSE|NOTICE|CONTRIBUTING|CODE_OF_CONDUCT)(?:\.md|\.txt|\.rst)?\b
    description: Documentation files (README/CHANGELOG/etc.) are not secrets

  - name: grep-non-recursive-non-secret
    # Allow non-recursive grep without secret keywords (broad, but recursive case is blocked)
    pattern: ^\s*grep\s+(?!-r\b|--recursive\b|-R\b)[^\n]*$
    description: Non-recursive grep is permitted (recursive blocked separately)
